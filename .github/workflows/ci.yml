name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Regenerate the API client from the committed contract: it must not change anything
      - name: API client is in sync with the contract
        run: |
          pnpm generate:api:local
          git diff --exit-code -- contract src/lib/api

      - name: Unit tests (includes the contrast test)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  e2e:
    name: End-to-end tests (left to right and right to left)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Starts the app against the fake sign-in service and the fake API in e2e/
      - name: Run the tests
        run: pnpm test:e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed. Layers are cached between runs.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: fursa-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name fursa-web -p 3000:3000 fursa-web:ci
          # Public pages answer 200 (no sign-in needed, no Supabase settings needed)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en/login || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET /en/login -> $code"
          [ "$code" = "200" ]
          welcome=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en)
          echo "GET /en -> $welcome"
          [ "$welcome" = "200" ]
          # An app page without a session is sent to sign in, and comes back to it afterwards
          read -r feed where < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:3000/en/feed)
          where=${where%$'\r'}
          echo "GET /en/feed -> $feed $where"
          [ "$feed" = "307" ]
          [ "$where" = "http://localhost:3000/en/login?next=%2Ffeed" ]
          # The style page must not exist in a production image
          dev=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en/dev/style)
          echo "GET /en/dev/style -> $dev"
          [ "$dev" = "404" ]
          # Security headers are present (on a page and on the redirect)
          curl -sI http://localhost:3000/en/login | grep -i '^content-security-policy:'
          curl -sI http://localhost:3000/en/login | grep -i '^x-frame-options: DENY'
          curl -sI http://localhost:3000/en/feed | grep -i '^content-security-policy:'

      - name: Container logs
        if: failure()
        run: docker logs fursa-web
